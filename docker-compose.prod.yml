version: '3.8'

services:
  intakeai:
    build: .
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./monitoring/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - intakeai
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Monitoring with simple uptime checker
  monitor:
    image: alpine:latest
    restart: unless-stopped
    volumes:
      - ./monitoring:/monitoring:ro
      - ./logs:/logs
    environment:
      - APP_URL=http://intakeai:5000
    command: >
      sh -c "
        apk add --no-cache curl jq &&
        while true; do
          /monitoring/health-monitor.sh
          sleep 300
        done
      "
    depends_on:
      - intakeai

volumes:
  data:
  logs: